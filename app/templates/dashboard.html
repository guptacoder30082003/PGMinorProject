{% extends "base.html" %}
{% block title %}Dashboard - ExpenserFX{% endblock %}

{% block content %}
<div class="content-section">
    <div id="budget-alert-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000; width: 300px;"></div>
    <h2 class="mb-4">Financial Dashboard</h2>
    <div class="card mb-4 border-primary">
        <div class="card-header bg-primary text-white">
            <h5>Account Settings</h5>
        </div>
        <div class="card-body">
            <form id="budgetForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Account Balance (₹)</label>
                            <input type="number" class="form-control" id="accountBalance" required min="0" value="10000">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Monthly Budget (₹)</label>
                            <input type="number" class="form-control" id="monthlyBudget" required min="1000" value="10000">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Update Settings</button>
            </form>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card h-100 border-primary">
                <div class="card-header bg-primary text-white">
                    <h5>Account Balance</h5>
                </div>
                <div class="card-body">
                    <h2 class="card-title">₹<span id="current-balance">0</span></h2>
                    <div class="progress mt-3">
                        <div id="budget-progress" class="progress-bar" role="progressbar" style="width: 0%"></div>
                    </div>
                    <small class="text-muted" id="budget-status">Budget: ₹<span id="total-debit">0</span>/₹<span id="current-budget">0</span></small>
                </div>
            </div>
        </div>
        <div class="col-md-8 mb-4">
            <div class="card h-100">
                <div class="card-header">
                    <h5>Latest Transactions</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Merchant</th>
                                    <th>Amount</th>
                                    <th>Type</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-body">
                                <tr>
                                    <td colspan="4" class="text-center">Loading transactions...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="budget-toast" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">Notification</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toast-message"></div>
    </div>
</div>

<script>
    const API_URL = 'https://pgbankapi.onrender.com/';  
    let lastBudgetNotification = 0;
    let fetchInterval;
    document.getElementById('budgetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const accountBalance = document.getElementById('accountBalance').value;
        const monthlyBudget = document.getElementById('monthlyBudget').value;
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    account_balance: accountBalance,
                    monthly_budget: monthlyBudget
                })
            });
            
            if (!response.ok) throw new Error('Failed to update settings');
            
            showNotification('Settings updated successfully!');
            location.reload();
        } catch (error) {
            console.error('Error:', error);
            showNotification('Failed to update settings');
        }
    });
    async function fetchData() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Failed to fetch data');
            
            const data = await response.json();
            updateDashboard(data);
        } catch (error) {
            console.error('Error fetching data:', error);
            showNotification('Error loading dashboard data');
        }
    }
    function updateDashboard(data) {
        document.getElementById('current-balance').textContent = data.balance.toLocaleString();
        document.getElementById('current-budget').textContent = data.monthly_budget.toLocaleString();
        document.getElementById('total-debit').textContent = data.total_debit.toLocaleString();
        const tbody = document.getElementById('transaction-body');
        if (data.transactions && data.transactions.length > 0) {
            tbody.innerHTML = data.transactions.map(t => `
                <tr>
                    <td>${new Date(t.time).toLocaleString()}</td>
                    <td>${t.merchant}</td>
                    <td class="${t.type === 'debit' ? 'text-danger' : 'text-success'}">
                        ₹${t.amount.toLocaleString()}
                    </td>
                    <td>${t.type}</td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center">No transactions found</td></tr>';
        }
        const budget = data.monthly_budget || 1;
        const percentage = Math.min(100, (data.total_debit / budget) * 100);
        
        const progressBar = document.getElementById('budget-progress');
        progressBar.style.width = `${percentage}%`;
        if (percentage > 90) {
            progressBar.className = 'progress-bar bg-danger';
            if (lastBudgetNotification < 90) {
                showTopAlert('Budget Warning!', 'You have used 90% of your monthly budget!', 'danger');
                lastBudgetNotification = 90;
            }
        } else if (percentage > 50) {
            progressBar.className = 'progress-bar bg-warning';
            if (lastBudgetNotification < 50) {
                showTopAlert('Budget Notice', 'You have used 50% of your monthly budget', 'warning');
                lastBudgetNotification = 50;
            }
        } else {
            progressBar.className = 'progress-bar bg-success';
            lastBudgetNotification = 0;
        }
    }
    function showNotification(message) {
        const toastEl = document.getElementById('budget-toast');
        const toast = new bootstrap.Toast(toastEl);
        document.getElementById('toast-message').textContent = message;
        toast.show();
    }
    function showTopAlert(title, message, type) {
        const alertContainer = document.getElementById('budget-alert-container');
        const alertId = 'alert-' + Date.now();
        const alertHTML = `
            <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                <strong>${title}</strong> ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
        alertContainer.insertAdjacentHTML('afterbegin', alertHTML);
        setTimeout(() => {
            const alert = document.getElementById(alertId);
            if (alert) alert.remove();
        }, 5000);
    }
    document.addEventListener('DOMContentLoaded', function() {
        fetchInterval = setInterval(fetchData, 10000);
        fetchData(); 
    });
</script>
{% endblock %}
